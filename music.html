<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSHO Music Player — Hustle House Family</title>
    <meta name="description" content="Pemutar musik Storysore dengan Galau Mode, Party Mode, dan Mode Hemat Performa Ringan.">
    <meta name="theme-color" content="#08090d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    
    <!-- Tailwind CSS & Font Awesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        /* ---------- Design Tokens ---------- */
        :root {
            --bg-void: #08090d;
            --bg-panel: rgba(16, 18, 26, 0.85);
            --bg-card: rgba(255, 255, 255, 0.04);
            --panel-border: rgba(255, 255, 255, 0.09);
            --ember: #ff8a4c;
            --ember-soft: #ffb37a;
            --ember-glow: rgba(255, 138, 76, 0.35);
            --dusk: #8f7aff;
            --dusk-soft: #b6a8ff;
            
            /* Party Mode Dynamic Tokens */
            --party-hue: 20;
            --party-color: hsl(var(--party-hue), 100%, 65%);
            --party-glow: hsla(var(--party-hue), 100%, 60%, 0.4);
            --party-border: hsla(var(--party-hue), 100%, 60%, 0.6);

            /* Galau Mode Dynamic Indigo Lavender Tokens */
            --galau-color: #818cf8;
            --galau-soft: #a5b4fc;
            --galau-glow: rgba(99, 102, 241, 0.4);
            --galau-border: rgba(129, 140, 248, 0.6);

            --text-primary: #f4f1e8;
            --text-muted: #8e92a5;
            --text-faint: #525668;
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-void);
            background-image: radial-gradient(circle at 50% 20%, rgba(255, 138, 76, 0.15), transparent 70%),
                              radial-gradient(circle at 80% 80%, rgba(143, 122, 255, 0.06), transparent 50%);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.3s ease;
        }

        /* Particle Canvas Background */
        #fireflyCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* Main Container */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            margin: 20px auto;
            background: var(--bg-panel);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-xl);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.65);
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        /* Landscape Split Screen untuk Tablet & Desktop */
        @media (min-width: 850px) {
            .app-container {
                grid-template-columns: 380px 1fr;
                height: 85vh;
                max-height: 720px;
                padding: 24px;
            }
        }

        /* Panel Kiri: Player */
        .player-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            background: rgba(0, 0, 0, 0.28);
            padding: 18px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow-y: auto;
            transition: border-color 0.15s ease;
        }

        .brand-header {
            text-align: center;
        }

        .brand-header h1 {
            font-family: var(--font-display);
            font-size: 1.75rem;
            color: var(--ember-soft);
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px rgba(255, 138, 76, 0.3);
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .brand-header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
            transition: color 0.3s ease;
        }

        /* Container Visualizer Equalizer */
        .art-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: rgba(12, 14, 20, 0.9);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .now-playing-info {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            text-align: center;
            z-index: 2;
        }

        .now-playing-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        #visualizer {
            width: 100%;
            height: 85px;
            z-index: 1;
        }

        /* Progress Bar Slider */
        .progress-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--ember);
            box-shadow: 0 0 12px var(--ember);
            cursor: pointer;
            transition: transform 0.1s ease, background 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover,
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.25);
        }

        /* Controls Playback Buttons */
        .controls-row {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin: 4px 0;
        }

        .btn-ctrl {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-ctrl:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-ctrl.active {
            color: var(--ember);
            text-shadow: 0 0 10px var(--ember-glow);
        }

        .btn-play {
            background: var(--ember);
            color: #000;
            font-size: 1.3rem;
            width: 52px;
            height: 52px;
            box-shadow: 0 0 22px var(--ember-glow);
            transition: background 0.3s ease, box-shadow 0.15s ease;
        }

        .btn-play:hover {
            background: var(--ember-soft);
            color: #000;
            transform: scale(1.06);
        }

        /* Volume & Toggles Container */
        .audio-settings {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            padding: 14px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: border-color 0.15s ease;
        }

        .setting-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .setting-row i {
            width: 20px;
            text-align: center;
            color: var(--ember-soft);
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        /* Toggle Switches */
        .fx-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .fx-toggle span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fx-toggle i {
            color: var(--ember-soft);
            width: 18px;
            transition: color 0.3s ease;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 22px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.12);
            transition: .3s; border-radius: 20px;
        }

        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--ember); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Panel Kanan: Playlist & Antrean */
        .playlist-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tabs {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.35);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            transition: border-color 0.15s ease;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 40px;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .badge {
            background: var(--ember);
            color: #000;
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 700;
            transition: background 0.3s ease;
        }

        .genre-select {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            padding: 0 10px;
            height: 42px;
            font-size: 0.82rem;
            outline: none;
            cursor: pointer;
        }

        .genre-select option {
            background: #10121a;
            color: var(--text-primary);
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 170px;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-faint);
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .search-box input {
            width: 100%;
            height: 42px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            padding: 8px 12px 8px 38px;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .search-box input:focus {
            border-color: var(--ember-soft);
        }

        .top-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.15);
        }

        /* Daftar Lagu Ergonomis untuk HP & Tablet */
        .song-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
            max-height: 380px;
        }

        @media (min-width: 850px) {
            .song-list {
                max-height: none;
            }
        }

        .song-list::-webkit-scrollbar {
            width: 6px;
        }

        .song-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            min-height: 54px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .song-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .song-item:active {
            transform: scale(0.98);
            background: rgba(255, 138, 76, 0.2);
        }

        .song-item.active {
            background: rgba(255, 138, 76, 0.15);
            border-color: rgba(255, 138, 76, 0.4);
            box-shadow: inset 3px 0 0 var(--ember);
        }

        .song-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            flex: 1;
            padding-right: 10px;
        }

        .song-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            gap: 2px;
        }

        .song-genre-tag {
            font-size: 0.68rem;
            color: var(--ember-soft);
            background: rgba(255, 138, 76, 0.12);
            padding: 1px 6px;
            border-radius: 4px;
            width: fit-content;
            font-weight: 600;
        }

        .song-icon {
            color: var(--text-faint);
            font-size: 0.95rem;
            min-width: 18px;
            text-align: center;
        }

        .song-item.active .song-icon {
            color: var(--ember);
        }

        .song-title {
            font-size: 0.88rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }

        .song-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .song-actions .icon-btn {
            width: 36px;
            height: 36px;
            font-size: 0.8rem;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(16, 18, 26, 0.95);
            border: 1px solid var(--ember);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1001;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ==================== PARTY MODE STYLES ==================== */
        body.party-active {
            background-color: #05020a;
        }

        body.party-active .app-container {
            border-color: var(--party-border);
            box-shadow: 0 0 40px var(--party-glow), inset 0 0 15px var(--party-glow);
        }

        body.party-active .player-panel,
        body.party-active .audio-settings,
        body.party-active .tabs {
            border-color: var(--party-border);
        }

        body.party-active .art-container {
            border-color: var(--party-color);
            box-shadow: 0 0 25px var(--party-glow), inset 0 0 20px rgba(0,0,0,0.9);
        }

        body.party-active .brand-header h1 {
            color: var(--party-color);
            text-shadow: 0 0 25px var(--party-color), 0 0 50px var(--party-color);
        }

        body.party-active .now-playing-title {
            color: var(--party-color);
            text-shadow: 0 0 12px var(--party-color);
        }

        body.party-active .btn-play {
            background: var(--party-color);
            box-shadow: 0 0 35px var(--party-color);
        }

        body.party-active .setting-row i,
        body.party-active .fx-toggle i,
        body.party-active .search-box i {
            color: var(--party-color);
        }

        body.party-active input[type="range"]::-webkit-slider-thumb {
            background: var(--party-color);
            box-shadow: 0 0 15px var(--party-color);
        }

        body.party-active input:checked + .slider {
            background-color: var(--party-color);
        }

        body.party-active .search-box input {
            border-color: var(--party-border);
            box-shadow: 0 0 15px var(--party-glow);
        }

        body.party-active .song-item {
            border-color: rgba(255, 255, 255, 0.08);
        }

        body.party-active .song-item.active {
            background: hsla(var(--party-hue), 100%, 60%, 0.22);
            border-color: var(--party-color);
            box-shadow: inset 4px 0 0 var(--party-color), 0 0 15px var(--party-glow);
        }

        body.party-active .song-item.active .song-icon {
            color: var(--party-color);
        }

        body.party-active .badge {
            background: var(--party-color);
            box-shadow: 0 0 10px var(--party-color);
        }

        body.party-active .icon-btn {
            border-color: var(--party-border);
        }

        /* ==================== GALAU MODE ==================== */
        body.galau-active {
            background-color: #070913;
            background-image: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.25), transparent 70%),
                              radial-gradient(circle at 80% 80%, rgba(165, 180, 252, 0.12), transparent 50%);
        }

        body.galau-active .app-container {
            border-color: var(--galau-border);
            box-shadow: 0 0 40px var(--galau-glow), inset 0 0 15px var(--galau-glow);
        }

        body.galau-active .player-panel,
        body.galau-active .audio-settings,
        body.galau-active .tabs {
            border-color: var(--galau-border);
        }

        body.galau-active .art-container {
            border-color: var(--galau-color);
            box-shadow: 0 0 25px var(--galau-glow), inset 0 0 20px rgba(0, 0, 0, 0.9);
        }

        body.galau-active .brand-header h1 {
            color: #a5b4fc;
            text-shadow: 0 0 20px var(--galau-glow);
        }

        body.galau-active .brand-header p {
            color: #818cf8;
        }

        body.galau-active .now-playing-title {
            color: #c7d2fe;
            text-shadow: 0 0 12px var(--galau-glow);
        }

        body.galau-active .btn-play {
            background: var(--galau-color);
            color: #ffffff;
            box-shadow: 0 0 30px var(--galau-glow);
        }

        body.galau-active .btn-play:hover {
            background: #a5b4fc;
        }

        body.galau-active .setting-row i,
        body.galau-active .fx-toggle i,
        body.galau-active .search-box i {
            color: #a5b4fc;
        }

        body.galau-active input[type="range"]::-webkit-slider-thumb {
            background: var(--galau-color);
            box-shadow: 0 0 15px var(--galau-glow);
        }

        body.galau-active input:checked + .slider {
            background-color: var(--galau-color);
        }

        body.galau-active .search-box input {
            border-color: var(--galau-border);
            box-shadow: 0 0 15px var(--galau-glow);
        }

        body.galau-active .song-item {
            border-color: rgba(165, 180, 252, 0.12);
        }

        body.galau-active .song-item.active {
            background: rgba(99, 102, 241, 0.22);
            border-color: var(--galau-color);
            box-shadow: inset 4px 0 0 var(--galau-color), 0 0 15px var(--galau-glow);
        }

        body.galau-active .song-item.active .song-icon {
            color: #a5b4fc;
        }

        body.galau-active .badge {
            background: var(--galau-color);
            color: #ffffff;
            box-shadow: 0 0 10px var(--galau-glow);
        }

        body.galau-active .icon-btn {
            border-color: var(--galau-border);
        }

        body.galau-active .toast {
            border-color: var(--galau-color);
        }

        /* ==================== LOW PERFORMANCE MODE ==================== */
        body.low-perf *,
        body.low-perf .app-container,
        body.low-perf .player-panel,
        body.low-perf .art-container,
        body.low-perf .audio-settings,
        body.low-perf .tabs {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        body.low-perf .app-container {
            background: rgba(12, 14, 22, 0.96) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8) !important;
        }

        body.low-perf .player-panel {
            background: rgba(0, 0, 0, 0.45) !important;
        }
    </style>
</head>
<body class="selection:bg-yellow-400 selection:text-black">

   <!-- NAVBAR WITH MOBILE BURGER MENU -->

    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <!-- Notification Toast -->
    <div class="toast" id="toastMsg">Pesanan Ditambahkan</div>

    <script>
        // --- CONSTANTS & STATE ---
        const PLAYLIST_URL = "https://api.npoint.io/f24ffd31e695999ad25c";
        
        let songs = [];
        let currentSong = null;
        let playQueue = [];
        let historyStack = [];
        let currentTab = 'all';
        
        let isShuffle = false;
        let repeatMode = 0; // 0: Off, 1: Repeat All, 2: Repeat One
        let isPartyMode = false;
        let isGalauMode = false;
        let isLowPerfMode = false;
        let sleepTimerMinutes = 0;
        let sleepTimerTimeout = null;

        let currentBassAvg = 0;
        let auroraTime = 0;

        // DOM Elements
        const audioPlayer = document.getElementById('audioPlayer');
        const songListEl = document.getElementById('songList');
        const currentTitleEl = document.getElementById('currentTitle');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const queueBadge = document.getElementById('queueBadge');
        const toastMsg = document.getElementById('toastMsg');
        const visualizerCanvas = document.getElementById('visualizer');
        const visCtx = visualizerCanvas ? visualizerCanvas.getContext('2d') : null;
        const brandTagline = document.getElementById('brandTagline');
        const genreSelect = document.getElementById('genreSelect');

        // Web Audio API Elements
        let audioCtx, sourceNode, analyser, gainNode, eqFilter;

        // --- INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            loadPlaylist();
            initFireflyCanvas();
            setupAudioContext();
            setupMediaSession();
        });

        // Fetch Songs JSON dari npoint.io
        async function loadPlaylist() {
            try {
                const response = await fetch(PLAYLIST_URL);
                songs = await response.json();
                populateGenreDropdown();
                renderSongList();
            } catch (err) {
                showToast("Gagal memuat playlist dari server.");
            }
        }

        // Generate Opsi Dropdown Genre Secara Dinamis
        function populateGenreDropdown() {
            const genres = new Set();
            songs.forEach(song => {
                if (song.genre) genres.add(song.genre);
            });

            genreSelect.innerHTML = '<option value="all">Semua Genre</option>';
            genres.forEach(genre => {
                const opt = document.createElement('option');
                opt.value = genre;
                opt.textContent = genre;
                genreSelect.appendChild(opt);
            });
        }

        // --- WEB AUDIO ENGINE & VISUALIZER SETUP ---
        function setupAudioContext() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            sourceNode = audioCtx.createMediaElementSource(audioPlayer);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;

            gainNode = audioCtx.createGain();
            eqFilter = audioCtx.createBiquadFilter();
            eqFilter.type = 'lowshelf';
            eqFilter.frequency.value = 250;
            
            // Sound FX Otomatis AKTIF sejak awal
            eqFilter.gain.value = 8; 

            sourceNode.connect(eqFilter);
            eqFilter.connect(analyser);
            analyser.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            drawVisualizer();
        }

        function resumeAudioCtx() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- PLAYBACK LOGIC ---
        function playSong(index) {
            resumeAudioCtx();
            currentSong = songs[index];
            audioPlayer.src = currentSong.src;
            audioPlayer.play();
            
            currentTitleEl.innerText = currentSong.title;
            playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            
            updateMediaSessionMetadata();
            renderSongList();
        }

        function togglePlay() {
            resumeAudioCtx();
            if (!currentSong && songs.length > 0) {
                playSong(0);
                return;
            }

            if (audioPlayer.paused) {
                audioPlayer.play();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                audioPlayer.pause();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        }

        function playNext() {
            if (repeatMode === 2 && currentSong) { // Repeat One
                playSong(songs.indexOf(currentSong));
                return;
            }

            if (playQueue.length > 0) {
                const nextSong = playQueue.shift();
                if (currentSong) historyStack.push(currentSong);
                updateQueueBadge();
                playSong(songs.indexOf(nextSong));
                showToast("Memutar dari antrean");
                return;
            }

            if (isShuffle) {
                const randomIndex = Math.floor(Math.random() * songs.length);
                playSong(randomIndex);
                return;
            }

            if (currentSong) {
                const currentIndex = songs.indexOf(currentSong);
                if (currentIndex < songs.length - 1) {
                    playSong(currentIndex + 1);
                } else if (repeatMode === 1) { // Repeat All
                    playSong(0);
                }
            }
        }

        function playPrev() {
            if (historyStack.length > 0) {
                const prevSong = historyStack.pop();
                playSong(songs.indexOf(prevSong));
            } else if (currentSong) {
                const currentIndex = songs.indexOf(currentSong);
                if (currentIndex > 0) playSong(currentIndex - 1);
            }
        }

        audioPlayer.onended = () => {
            playNext();
        };

        audioPlayer.ontimeupdate = () => {
            if (audioPlayer.duration) {
                const pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.value = pct;
                currentTimeEl.innerText = formatTime(audioPlayer.currentTime);
                durationEl.innerText = formatTime(audioPlayer.duration);
            }
        };

        function seekSong() {
            if (audioPlayer.duration) {
                audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
            }
        }

        // --- QUEUE & TAB SYSTEM ---
        function addToQueue(index, e) {
            e.stopPropagation();
            const song = songs[index];
            playQueue.push(song);
            updateQueueBadge();
            showToast(`"${song.title}" masuk antrean`);
            if (currentTab === 'queue') renderSongList();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabAll').classList.toggle('active', tab === 'all');
            document.getElementById('tabQueue').classList.toggle('active', tab === 'queue');
            renderSongList();
        }

        function updateQueueBadge() {
            queueBadge.innerText = playQueue.length;
        }

        // Render Song List UI dengan Tag Genre & Filter
        function renderSongList() {
            songListEl.innerHTML = '';
            const query = document.getElementById('searchInput').value.toLowerCase();
            const selectedGenre = genreSelect.value;
            const listToRender = currentTab === 'all' ? songs : playQueue;

            if (listToRender.length === 0) {
                songListEl.innerHTML = `<div style="text-align:center; padding: 30px; color: var(--text-faint); font-size:0.85rem;">${currentTab === 'queue' ? 'Antrean lagu kosong' : 'Lagu tidak ditemukan'}</div>`;
                return;
            }

            listToRender.forEach((song, idx) => {
                const songGenre = song.genre || "General";
                
                // Filter berdasarkan kata kunci pencarian dan dropdown genre
                const matchesQuery = song.title.toLowerCase().includes(query) || songGenre.toLowerCase().includes(query);
                const matchesGenre = selectedGenre === 'all' || songGenre === selectedGenre;

                if (!matchesQuery || !matchesGenre) return;

                const isCurrent = currentSong && currentSong.src === song.src;
                const songItem = document.createElement('div');
                songItem.className = `song-item ${isCurrent ? 'active' : ''}`;
                
                const songIndexInMaster = songs.indexOf(song);

                songItem.innerHTML = `
                    <div class="song-meta">
                        <i class="fa-solid ${isCurrent ? 'fa-chart-simple' : 'fa-music'} song-icon"></i>
                        <div class="song-details">
                            <span class="song-title">${song.title}</span>
                            <span class="song-genre-tag">${songGenre}</span>
                        </div>
                    </div>
                    <div class="song-actions">
                        ${currentTab === 'all' ? `
                            <button class="icon-btn" onclick="addToQueue(${songIndexInMaster}, event)" title="Tambah Antrean">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        ` : ''}
                    </div>
                `;

                songItem.onclick = () => playSong(songIndexInMaster);
                songListEl.appendChild(songItem);
            });
        }

        function filterSongs() {
            renderSongList();
        }

        // --- MODES & TOGGLES ---
        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
            showToast(isShuffle ? "Mode acak AKTIF" : "Mode acak NONAKTIF");
        }

        function toggleRepeat() {
            repeatMode = (repeatMode + 1) % 3;
            const repeatBtn = document.getElementById('repeatBtn');
            if (repeatMode === 0) {
                repeatBtn.classList.remove('active');
                repeatBtn.innerHTML = '<i class="fa-solid fa-repeat"></i>';
                showToast("Pengulangan MATI");
            } else if (repeatMode === 1) {
                repeatBtn.classList.add('active');
                repeatBtn.innerHTML = '<i class="fa-solid fa-repeat"></i>';
                showToast("Ulangi SEMUA");
            } else {
                repeatBtn.classList.add('active');
                repeatBtn.innerHTML = '<i class="fa-solid fa-1"></i>';
                showToast("Ulangi SATU LAGU");
            }
        }

        function adjustMusicVolume() {
            audioPlayer.volume = document.getElementById('musicVolume').value;
        }

        function togglePartyMode() {
            isPartyMode = document.getElementById('partySwitch').checked;
            
            if (isPartyMode) {
                if (isGalauMode) {
                    isGalauMode = false;
                    document.getElementById('galauSwitch').checked = false;
                    document.body.classList.remove('galau-active');
                }
                document.body.classList.add('party-active');
                brandTagline.innerText = "Malam di sekitar api";
                showToast("PARTY MODE MERIAH AKTIF 🎉🔥");
            } else {
                document.body.classList.remove('party-active');
                document.body.style.backgroundImage = '';
                showToast("Party Mode NONAKTIF");
            }
        }

        function toggleGalauMode() {
            isGalauMode = document.getElementById('galauSwitch').checked;

            if (isGalauMode) {
                if (isPartyMode) {
                    isPartyMode = false;
                    document.getElementById('partySwitch').checked = false;
                    document.body.classList.remove('party-active');
                }
                document.body.classList.add('galau-active');
                brandTagline.innerText = "Meresapi malam & kenangan 🌧️";
                showToast("Galau Mode AKTIF 🌧️ (Aurora & Lavender Glow)");
            } else {
                document.body.classList.remove('galau-active');
                document.body.style.backgroundImage = '';
                brandTagline.innerText = "Malam di sekitar api";
                showToast("Galau Mode NONAKTIF");
            }
        }

        function toggleLowPerfMode() {
            isLowPerfMode = document.getElementById('lowPerfSwitch').checked;
            document.body.classList.toggle('low-perf', isLowPerfMode);
            showToast(isLowPerfMode ? "Mode Hemat AKTIF ⚡ (Ringan di HP/Tab)" : "Mode Hemat NONAKTIF");
        }

        function toggleAudioFX() {
            const isChecked = document.getElementById('fxSwitch').checked;
            if (eqFilter) {
                eqFilter.gain.value = isChecked ? 8 : 0;
                showToast(isChecked ? "Sound FX Aktif 🔊" : "Sound FX Matikan");
            }
        }

        // Sleep Timer Toggle
        function cycleSleepTimer() {
            const times = [0, 15, 30, 45, 60];
            const currentIndex = times.indexOf(sleepTimerMinutes);
            sleepTimerMinutes = times[(currentIndex + 1) % times.length];
            
            const btn = document.getElementById('sleepTimerBtn');
            clearTimeout(sleepTimerTimeout);

            if (sleepTimerMinutes > 0) {
                btn.style.color = "var(--ember)";
                showToast(`Sleep Timer: ${sleepTimerMinutes} menit`);
                sleepTimerTimeout = setTimeout(() => {
                    audioPlayer.pause();
                    playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                    showToast("Sleep Timer: Musik dihentikan");
                }, sleepTimerMinutes * 60 * 1000);
            } else {
                btn.style.color = "var(--text-muted)";
                showToast("Sleep Timer NONAKTIF");
            }
        }

        // --- MEDIASESSION AND UTILS ---
        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', () => togglePlay());
                navigator.mediaSession.setActionHandler('pause', () => togglePlay());
                navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
                navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
            }
        }

        function updateMediaSessionMetadata() {
            if ('mediaSession' in navigator && currentSong) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: currentSong.title,
                    artist: 'Storysore Player',
                    album: 'Malam di Sekitar Api',
                    artwork: [{ src: 'bg.jpg', sizes: '512x512', type: 'image/jpeg' }]
                });
            }
        }

        function formatTime(sec) {
            if (isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function showToast(msg) {
            toastMsg.innerText = msg;
            toastMsg.classList.add('show');
            setTimeout(() => toastMsg.classList.remove('show'), 2200);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // --- CANVAS VISUALIZER BALOK & BEAT LIGHTING GLOW ---
        let partyHue = 0;

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!visCtx || !analyser) return;

            visualizerCanvas.width = visualizerCanvas.clientWidth;
            visualizerCanvas.height = visualizerCanvas.clientHeight;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            visCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);

            const numBars = 28;
            const barGap = 4;
            const totalGap = (numBars - 1) * barGap;
            const barWidth = (visualizerCanvas.width - totalGap) / numBars;

            let bassSum = 0;

            for (let i = 0; i < numBars; i++) {
                const dataIndex = Math.floor((i / numBars) * (bufferLength * 0.7));
                const val = dataArray[dataIndex] || 0;
                
                if (i < 6) bassSum += val; // Beat bass energy detector

                const percent = val / 255;
                const barHeight = Math.max(4, percent * (visualizerCanvas.height - 12));
                const x = i * (barWidth + barGap);
                const y = visualizerCanvas.height - barHeight;

                const gradient = visCtx.createLinearGradient(0, visualizerCanvas.height, 0, y);
                
                if (isGalauMode) {
                    gradient.addColorStop(0, 'rgba(79, 70, 229, 0.2)');
                    gradient.addColorStop(0.6, 'rgba(99, 102, 241, 0.85)');
                    gradient.addColorStop(1, 'rgba(165, 180, 252, 1)');
                } else if (isPartyMode) {
                    gradient.addColorStop(0, `hsla(${partyHue + i * 8}, 100%, 50%, 0.25)`);
                    gradient.addColorStop(1, `hsla(${partyHue + i * 8}, 100%, 70%, 1)`);
                } else {
                    gradient.addColorStop(0, 'rgba(255, 138, 76, 0.2)');
                    gradient.addColorStop(0.6, 'rgba(255, 138, 76, 0.8)');
                    gradient.addColorStop(1, 'rgba(255, 179, 122, 1)');
                }

                visCtx.fillStyle = gradient;
                
                visCtx.beginPath();
                if (visCtx.roundRect) {
                    visCtx.roundRect(x, y, barWidth, barHeight, [4, 4, 0, 0]);
                } else {
                    visCtx.rect(x, y, barWidth, barHeight);
                }
                visCtx.fill();

                if (barHeight > 8) {
                    visCtx.fillStyle = isGalauMode 
                        ? '#e0e7ff' 
                        : (isPartyMode ? `hsla(${partyHue + i * 5}, 100%, 90%, 0.95)` : '#ffffff');
                    visCtx.beginPath();
                    visCtx.arc(x + barWidth / 2, y + 2, Math.min(barWidth / 3, 2.5), 0, Math.PI * 2);
                    visCtx.fill();
                }
            }

            currentBassAvg = audioPlayer.paused ? 0 : bassSum / 6;

            // Galau Mode Indigo Lavender Light Glow Synchronization
            if (isGalauMode && !audioPlayer.paused) {
                const glowAlpha = 0.25 + (currentBassAvg / 255) * 0.55;
                const borderAlpha = 0.4 + (currentBassAvg / 255) * 0.55;

                document.documentElement.style.setProperty('--galau-glow', `rgba(99, 102, 241, ${glowAlpha})`);
                document.documentElement.style.setProperty('--galau-border', `rgba(165, 180, 252, ${borderAlpha})`);
            }

            // Party Mode Dynamic Lighting Sync
            if (isPartyMode && !audioPlayer.paused) {
                partyHue = (partyHue + (currentBassAvg > 80 ? currentBassAvg / 30 : 1.5)) % 360;

                document.documentElement.style.setProperty('--party-hue', partyHue);

                const glowIntensity = 0.2 + (currentBassAvg / 255) * 0.5;
                if (!isLowPerfMode) {
                    document.body.style.backgroundImage = `
                        radial-gradient(circle at 50% 30%, hsla(${partyHue}, 100%, 50%, ${glowIntensity}), transparent 60%),
                        radial-gradient(circle at 80% 80%, hsla(${(partyHue + 120) % 360}, 100%, 50%, ${glowIntensity * 0.7}), transparent 50%),
                        radial-gradient(circle at 20% 70%, hsla(${(partyHue + 240) % 360}, 100%, 50%, ${glowIntensity * 0.6}), transparent 50%)
                    `;
                }
            }
        }

        // --- AURORA BOREALIS ANIMATION ENGINE ---
        function drawAurora(ctx, width, height, avgBass) {
            auroraTime += 0.005 + (avgBass / 255) * 0.004;

            const layers = isLowPerfMode ? [
                { colorStart: 'rgba(99, 102, 241, 0.35)', colorEnd: 'rgba(165, 180, 252, 0)', yOffset: height * 0.3, amplitude: 40, speed: 1 }
            ] : [
                { colorStart: 'rgba(79, 70, 229, 0.35)', colorEnd: 'rgba(129, 140, 248, 0)', yOffset: height * 0.2, amplitude: 50, speed: 1 },
                { colorStart: 'rgba(147, 51, 234, 0.28)', colorEnd: 'rgba(192, 132, 252, 0)', yOffset: height * 0.32, amplitude: 70, speed: 0.7 },
                { colorStart: 'rgba(99, 102, 241, 0.3)', colorEnd: 'rgba(165, 180, 252, 0)', yOffset: height * 0.42, amplitude: 60, speed: 1.2 }
            ];

            ctx.save();
            ctx.globalCompositeOperation = 'screen';

            const xStep = isLowPerfMode ? 28 : 12;

            layers.forEach((layer) => {
                const grad = ctx.createLinearGradient(0, layer.yOffset - 100, 0, layer.yOffset + 300);
                grad.addColorStop(0, layer.colorStart);
                grad.addColorStop(1, layer.colorEnd);

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(0, height);

                for (let x = 0; x <= width; x += xStep) {
                    const wave1 = Math.sin(x * 0.003 + auroraTime * layer.speed) * (layer.amplitude + avgBass * 0.15);
                    const wave2 = Math.cos(x * 0.006 - auroraTime * 0.5 * layer.speed) * (layer.amplitude * 0.5);
                    const y = layer.yOffset + wave1 + wave2;

                    if (x === 0) ctx.lineTo(x, y);
                    else ctx.lineTo(x, y);
                }

                ctx.lineTo(width, height);
                ctx.closePath();
                ctx.fill();
            });

            ctx.restore();
        }

        // Particle Canvas Animation
        function initFireflyCanvas() {
            const canvas = document.getElementById('fireflyCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 2.2 + 0.5,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.8) * 0.3,
                    alpha: Math.random()
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (isGalauMode) {
                    drawAurora(ctx, canvas.width, canvas.height, currentBassAvg);
                }

                const activeParticlesCount = isLowPerfMode ? 15 : particles.length;

                for (let i = 0; i < activeParticlesCount; i++) {
                    const p = particles[i];
                    let speedMultiplier = isPartyMode ? 2.5 : (isGalauMode ? 0.45 : 1);
                    
                    p.x += p.vx * speedMultiplier;
                    p.y += (isGalauMode ? Math.abs(p.vy) * 0.6 : p.vy) * speedMultiplier;

                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                    if (p.x < 0 || p.x > canvas.width) p.x = Math.random() * canvas.width;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, isPartyMode ? p.r * 1.8 : p.r, 0, Math.PI * 2);
                    
                    if (isGalauMode) {
                        ctx.fillStyle = `rgba(165, 180, 252, ${p.alpha * 0.85})`;
                    } else if (isPartyMode) {
                        ctx.fillStyle = `hsla(${(partyHue + i * 8) % 360}, 100%, 65%, ${p.alpha * 0.95})`;
                    } else {
                        ctx.fillStyle = `rgba(255, 179, 122, ${p.alpha})`;
                    }
                    
                    ctx.fill();
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        // Fungsi Toggle Mobile Burger Menu
        function toggleMobileMenu() {
            const mobileMenu = document.getElementById("mobileMenu");
            const menuIcon = document.getElementById("menuIcon");
            
            mobileMenu.classList.toggle("hidden");
            
            if (mobileMenu.classList.contains("hidden")) {
                menuIcon.classList.remove("fa-xmark");
                menuIcon.classList.add("fa-bars");
            } else {
                menuIcon.classList.remove("fa-bars");
                menuIcon.classList.add("fa-xmark");
            }
        }
    </script>
